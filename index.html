<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Surprise For You!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky-deep:#0B1B3D;
  --sky-mid:#1E6FD9;
  --sky-day:#7ED0F7;
  --grass:#4FB84B;
  --grass-dark:#1F6B3B;
  --gold:#FFC13B;
  --orange:#FF7A2F;
  --pink:#FF5FA2;
  --cream:#FFFDF6;
  --teal:#2AC9C0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Nunito',system-ui,sans-serif;
  background:var(--sky-deep);
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
}
#stage{position:fixed;inset:0;overflow:hidden}

/* ---------- SKY ---------- */
#sky{
  position:absolute;inset:0;
  background:linear-gradient(180deg,var(--sky-deep) 0%,#16336E 45%,#2B5FA8 100%);
  transition:background 1.6s ease;
}
.day #sky{
  background:linear-gradient(180deg,#1E6FD9 0%,#5BB6F0 42%,#A9E4FA 72%,#DFF6E0 100%);
}

/* stars fade out on reveal */
#stars{position:absolute;inset:0;transition:opacity 1.2s ease}
.day #stars{opacity:0}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.85;
  animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}

/* sun rays behind everything after burst */
#rays{
  position:absolute;left:50%;top:42%;width:220vmax;height:220vmax;
  transform:translate(-50%,-50%) rotate(0deg);
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.20) 0deg 7deg,rgba(255,255,255,0) 7deg 18deg);
  opacity:0;transition:opacity 1.4s ease;
  animation:spin 46s linear infinite;
}
.day #rays{opacity:.55}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* ---------- TOWER + HILLS ---------- */
#tower{
  position:absolute;left:50%;bottom:20vh;transform:translateX(-50%);
  width:min(120px,22vw);height:46vh;
  background:linear-gradient(180deg,#0E1E3F,#20386B);
  clip-path:polygon(28% 100%,20% 24%,42% 0%,58% 0%,80% 24%,72% 100%);
  opacity:.55;filter:blur(.4px);
}
#tower::after{
  content:"";position:absolute;left:50%;top:34%;transform:translateX(-50%);
  width:26%;height:14%;border-radius:50%;
  background:var(--teal);box-shadow:0 0 26px 10px rgba(42,201,192,.75);
  animation:pulseCore 2.4s ease-in-out infinite;
}
@keyframes pulseCore{0%,100%{opacity:.55;transform:translateX(-50%) scale(.9)}50%{opacity:1;transform:translateX(-50%) scale(1.15)}}

.hill{position:absolute;bottom:14vh;width:70vw;height:26vh;border-radius:50% 50% 0 0;background:#17406F;opacity:.6}
.hill.left{left:-16vw}
.hill.right{right:-18vw;height:20vh;background:#1B4C7E}

.cloud{position:absolute;background:#fff;border-radius:100px;opacity:0;transition:opacity 1.5s ease}
.day .cloud{opacity:.85}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{top:12%;width:150px;height:44px;animation:drift 44s linear infinite}
.c1::before{width:70px;height:70px;top:-30px;left:24px}
.c1::after{width:50px;height:50px;top:-20px;left:82px}
.c2{top:26%;width:110px;height:34px;animation:drift 62s linear infinite;animation-delay:-20s}
.c2::before{width:54px;height:54px;top:-24px;left:18px}
.c2::after{width:40px;height:40px;top:-16px;left:60px}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(120vw)}}

/* ---------- GROUND ---------- */
#ground{
  position:absolute;left:0;right:0;bottom:0;height:22vh;
  background:linear-gradient(180deg,var(--grass) 0%,var(--grass-dark) 100%);
  border-radius:44% 56% 0 0/ 22% 22% 0 0;
  box-shadow:0 -6px 0 rgba(255,255,255,.18) inset;
  transform:translateY(105%);transition:transform 1s cubic-bezier(.2,1.2,.3,1) .25s;
}
.day #ground{transform:translateY(0)}
.blade{position:absolute;bottom:0;width:10px;height:30px;background:var(--grass);
  border-radius:50% 50% 0 0;transform-origin:bottom center;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}

/* ---------- CAPSULE ---------- */
#capsuleWrap{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  display:grid;place-items:center;gap:26px;
}
#capsule{
  display:block;width:min(240px,52vw);height:auto;overflow:visible;
  filter:drop-shadow(0 22px 34px rgba(0,0,0,.5)) drop-shadow(0 0 30px rgba(86,214,255,.55));
  animation:dropIn 1.1s cubic-bezier(.3,1.5,.4,1) both, bob 2.6s ease-in-out 1.1s infinite;
}
#capsule .aura,#capsule .core,#capsule .glint{transform-box:fill-box;transform-origin:center}
#capsule .aura{animation:auraPulse 2.6s ease-in-out infinite}
#capsule .core{animation:corePulse 2.6s ease-in-out infinite}
#capsule .glint{animation:glint 3.4s ease-in-out infinite}
@keyframes auraPulse{0%,100%{opacity:.40;transform:scale(.92)}50%{opacity:.95;transform:scale(1.08)}}
@keyframes corePulse{0%,100%{opacity:.32;transform:scale(.86)}50%{opacity:.78;transform:scale(1.10)}}
@keyframes glint{0%,100%{opacity:.30}45%{opacity:.85}}
@keyframes dropIn{from{transform:translateY(-70vh) scale(.6) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}

.shaking #capsule{animation:shake .12s linear 8, none;}
@keyframes shake{
  0%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(-9px,3px) rotate(-7deg) scale(1.04)}
  50%{transform:translate(8px,-4px) rotate(7deg) scale(1.07)}
  75%{transform:translate(-6px,4px) rotate(-5deg) scale(1.04)}
  100%{transform:translate(0,0) rotate(0) scale(1.1)}
}
.opened #capsuleWrap{opacity:0;transform:translate(-50%,-50%) scale(2.4);transition:all .5s ease-out;pointer-events:none}

#hint{
  font-family:'Luckiest Guy',Impact,sans-serif;letter-spacing:2px;
  color:var(--cream);font-size:clamp(18px,3.4vw,30px);
  text-shadow:0 3px 0 #0E1E3F,0 0 24px rgba(255,193,59,.8);
  animation:pop 1.4s ease-in-out infinite;
}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ---------- BURST ---------- */
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.opened #flash{animation:flash 1.1s ease-out forwards}
@keyframes flash{0%{opacity:0}8%{opacity:1}100%{opacity:0}}
.ring{
  position:absolute;left:50%;top:46%;width:40px;height:40px;margin:-20px 0 0 -20px;
  border-radius:50%;border:8px solid var(--gold);opacity:0;pointer-events:none;
}
.opened .ring{animation:ringOut 1.1s cubic-bezier(.1,.8,.3,1) forwards}
.opened .ring:nth-child(2){animation-delay:.12s;border-color:var(--pink)}
.opened .ring:nth-child(3){animation-delay:.24s;border-color:var(--teal)}
@keyframes ringOut{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(26)}}

#confetti{position:absolute;inset:0;pointer-events:none}

/* ---------- MESSAGE ---------- */
#message{
  position:absolute;inset:0;display:grid;place-content:center;justify-items:center;
  padding:24px 24px 92px;text-align:center;gap:clamp(12px,2.2vh,24px);
  opacity:0;pointer-events:none;
}
.opened #message{opacity:1}

#title{
  font-family:'Luckiest Guy',Impact,sans-serif;
  font-size:clamp(42px,11vw,120px);line-height:.95;letter-spacing:2px;
  color:var(--cream);
  display:flex;flex-wrap:wrap;justify-content:center;
}
#title span{
  display:inline-block;opacity:0;transform:translateY(-60px) rotate(-18deg) scale(.4);
  background:linear-gradient(180deg,#FFFDF6 40%,var(--gold) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;
  filter:drop-shadow(0 4px 0 #0E1E3F) drop-shadow(0 8px 14px rgba(0,0,0,.45));
}
#title span.in{animation:letterIn .6s cubic-bezier(.2,1.7,.4,1) forwards}
#title .sp{width:.34em}
@keyframes letterIn{to{opacity:1;transform:none}}

#sub{
  font-weight:900;font-size:clamp(17px,3.2vw,30px);color:#0E1E3F;
  background:rgba(255,253,246,.94);
  border:4px solid #0E1E3F;border-radius:22px;
  padding:16px 24px;max-width:min(760px,92vw);
  box-shadow:0 10px 0 rgba(14,30,63,.35),0 18px 40px rgba(0,0,0,.25);
  opacity:0;transform:translateY(34px) scale(.9);
}
#sub.in{animation:subIn .7s cubic-bezier(.2,1.5,.4,1) forwards}
#sub b{color:var(--orange)}
@keyframes subIn{to{opacity:1;transform:none}}

/* the new computer */
#pc{width:clamp(150px,26vw,240px);opacity:0;transform:translateY(60px) scale(.7)}
#pc.in{animation:pcIn .9s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pcIn{to{opacity:1;transform:none}}
#pc .screenGlow{animation:screenPulse 2.2s ease-in-out infinite}
@keyframes screenPulse{0%,100%{opacity:.35}50%{opacity:.9}}

#again{
  font-family:'Luckiest Guy',Impact,sans-serif;letter-spacing:1px;
  font-size:clamp(15px,2.4vw,22px);color:#0E1E3F;background:var(--gold);
  border:4px solid #0E1E3F;border-radius:999px;padding:12px 26px;cursor:pointer;
  box-shadow:0 7px 0 #0E1E3F;opacity:0;pointer-events:none;transition:opacity .5s ease .2s;
}
.opened #again{opacity:1;pointer-events:auto}
#again:hover{transform:translateY(2px);box-shadow:0 5px 0 #0E1E3F}
#again:active{transform:translateY(7px);box-shadow:0 0 0 #0E1E3F}
#again:focus-visible{outline:4px solid var(--pink);outline-offset:4px}

/* signature */
#signature{
  position:absolute;left:50%;bottom:3.2vh;
  display:flex;align-items:center;gap:14px;
  font-family:'Luckiest Guy',Impact,sans-serif;letter-spacing:1.5px;
  font-size:clamp(16px,3.1vw,32px);color:#FFFFFF;white-space:nowrap;
  text-shadow:0 4px 0 #0E1E3F,0 0 22px rgba(14,30,63,.6);
  opacity:0;transform:translate(-50%,26px);
}
#signature.in{animation:sigIn .8s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes sigIn{to{opacity:1;transform:translate(-50%,0)}}
#signature .mimi{
  display:inline-block;font-style:normal;font-size:1.6em;line-height:.85;
  padding:0 .05em;vertical-align:-.06em;
  background:linear-gradient(100deg,#FF4D8D,#FF7A2F,#FFC13B,#4FB84B,#2AC9C0,#5BB6F0,#B36BFF,#FF4D8D);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  text-shadow:none;filter:drop-shadow(0 4px 0 #0E1E3F);
  animation:rainbow 4.5s linear infinite;
}
@keyframes rainbow{to{background-position:300% 0}}
#signature svg{width:1.05em;height:1.05em;flex:none;
  filter:drop-shadow(0 3px 0 #0E1E3F);animation:beat 1.3s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}18%{transform:scale(1.22)}36%{transform:scale(1)}54%{transform:scale(1.14)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.2s!important}
}
</style>
</head>
<body>
<div id="stage">
  <div id="sky"></div>
  <div id="stars"></div>
  <div id="rays"></div>

  <div class="hill left"></div>
  <div class="hill right"></div>
  <div id="tower"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>

  <div id="ground"></div>

  <div class="ring"></div><div class="ring"></div><div class="ring"></div>
  <canvas id="confetti"></canvas>

  <div id="capsuleWrap">
    <svg id="capsule" viewBox="0 0 200 200" role="img" aria-label="A glowing sphere">
      <defs>
        <radialGradient id="orbG" cx="34%" cy="26%" r="76%">
          <stop offset="0" stop-color="#F4FEFF"/>
          <stop offset=".16" stop-color="#A9EBFC"/>
          <stop offset=".50" stop-color="#3FB0E4"/>
          <stop offset=".82" stop-color="#0F6FAC"/>
          <stop offset="1" stop-color="#07456E"/>
        </radialGradient>
        <radialGradient id="auraG" cx="50%" cy="50%" r="50%">
          <stop offset=".52" stop-color="#8FE6FF" stop-opacity=".55"/>
          <stop offset=".78" stop-color="#3FC6F5" stop-opacity=".26"/>
          <stop offset="1" stop-color="#3FC6F5" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFF7D6"/>
          <stop offset=".25" stop-color="#F2CB63"/>
          <stop offset=".52" stop-color="#B98324"/>
          <stop offset=".74" stop-color="#F6DC8B"/>
          <stop offset="1" stop-color="#8A5A13"/>
        </linearGradient>
        <linearGradient id="goldBackG" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#6E440E"/>
          <stop offset="1" stop-color="#A9761E"/>
        </linearGradient>
        <clipPath id="ballClip"><circle cx="100" cy="100" r="61"/></clipPath>
      </defs>

      <circle class="aura" cx="100" cy="100" r="92" fill="url(#auraG)"/>

      <!-- gold bands passing behind the orb -->
      <g transform="rotate(-18 100 100)" fill="none" stroke="url(#goldBackG)" stroke-width="10">
        <ellipse cx="100" cy="100" rx="70" ry="27"/>
        <ellipse cx="100" cy="100" rx="27" ry="70"/>
      </g>

      <circle cx="100" cy="100" r="61" fill="url(#orbG)"/>

      <!-- crystal swirls inside the glass -->
      <g clip-path="url(#ballClip)">
        <circle class="core" cx="97" cy="105" r="35" fill="#CFF6FF" opacity=".5"/>
        <path d="M50 120 q26-32 58-19 t46-27" fill="none" stroke="#E4FAFF" stroke-opacity=".42" stroke-width="8" stroke-linecap="round"/>
        <path d="M44 86 q30 23 62 6 t48 5" fill="none" stroke="#FFFFFF" stroke-opacity=".26" stroke-width="5" stroke-linecap="round"/>
        <ellipse class="glint" cx="74" cy="70" rx="23" ry="13" fill="#FFFFFF" opacity=".6" transform="rotate(-32 74 70)"/>
        <ellipse cx="124" cy="134" rx="13" ry="7" fill="#FFFFFF" opacity=".22" transform="rotate(-28 124 134)"/>
      </g>
      <circle cx="100" cy="100" r="61" fill="none" stroke="#06304F" stroke-opacity=".35" stroke-width="3"/>

      <!-- gold bands across the front -->
      <g transform="rotate(-18 100 100)">
        <g clip-path="url(#ballClip)" fill="none" stroke="url(#goldG)" stroke-width="9" stroke-linecap="round">
          <ellipse cx="100" cy="100" rx="70" ry="27"/>
          <ellipse cx="100" cy="100" rx="27" ry="70"/>
        </g>
      </g>

      <!-- curling filigree -->
      <g clip-path="url(#ballClip)" fill="none" stroke="url(#goldG)" stroke-width="7" stroke-linecap="round">
        <path d="M56 122 q6-30 34-30 q24 0 23 21 q-1 16-18 14 q-13-2-9-15"/>
        <path d="M148 84 q-4 24-26 25" stroke-width="6"/>
      </g>

      <!-- spikes and caps -->
      <g transform="rotate(-18 100 100)" fill="url(#goldG)" stroke="#5E3B08" stroke-width="2" stroke-linejoin="round">
        <path d="M17 100 L45 83 L40 100 L45 117 Z"/>
        <path d="M183 100 L155 83 L160 100 L155 117 Z"/>
        <path d="M100 11 L115 40 L100 51 L85 40 Z"/>
        <rect x="85" y="39" width="30" height="11" rx="5"/>
        <path d="M100 189 L113 163 L100 154 L87 163 Z"/>
        <rect x="87" y="151" width="26" height="10" rx="5"/>
      </g>
    </svg>
    <div id="hint">TAP THE SPHERE</div>
  </div>

  <div id="message">
    <h1 id="title" aria-label="Happy Birthday!"></h1>
    <p id="sub">Now you can play <b>Palworld</b> on your own computer!</p>
    <svg id="pc" viewBox="0 0 200 170" role="img" aria-label="A brand new computer">
      <rect x="78" y="118" width="44" height="18" fill="#0E1E3F"/>
      <rect x="52" y="132" width="96" height="14" rx="7" fill="#0E1E3F"/>
      <rect x="8" y="6" width="184" height="118" rx="14" fill="#0E1E3F"/>
      <rect x="18" y="16" width="164" height="92" rx="7" fill="#1E6FD9"/>
      <rect x="18" y="16" width="164" height="92" rx="7" fill="url(#g)"/>
      <circle class="screenGlow" cx="100" cy="60" r="26" fill="#FFC13B"/>
      <path d="M18 92 q40-26 78-6 t68-14 v30 a7 7 0 0 1-7 7 H25 a7 7 0 0 1-7-7 z" fill="#1F6B3B"/>
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1E6FD9"/>
          <stop offset="1" stop-color="#A9E4FA"/>
        </linearGradient>
      </defs>
    </svg>
    <button id="again" type="button">Play it again</button>
  </div>

  <div id="signature">
    <span>With lots of love, from <i class="mimi">Mimi</i>!</span>
    <svg viewBox="0 0 24 24" role="img" aria-label="heart">
      <defs>
        <linearGradient id="heartG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFE7A0"/>
          <stop offset=".55" stop-color="#FFC13B"/>
          <stop offset="1" stop-color="#F0960F"/>
        </linearGradient>
      </defs>
      <path d="M12 21.2 3.6 12.8a5.2 5.2 0 0 1 7.4-7.3l1 1 1-1a5.2 5.2 0 1 1 7.4 7.3z"
            fill="url(#heartG)" stroke="#0E1E3F" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
  </div>

  <div id="flash"></div>
</div>

<script>
(function(){
  const stage=document.getElementById('stage');
  const capsule=document.getElementById('capsule');
  const titleEl=document.getElementById('title');
  const sub=document.getElementById('sub');
  const pc=document.getElementById('pc');
  const sig=document.getElementById('signature');
  const again=document.getElementById('again');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let opened=false,timers=[];

  /* stars */
  const starBox=document.getElementById('stars');
  for(let i=0;i<70;i++){
    const s=document.createElement('div');
    s.className='star';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*62+'%';
    s.style.animationDelay=(Math.random()*3)+'s';
    s.style.transform='scale('+(.5+Math.random()*1.3)+')';
    starBox.appendChild(s);
  }
  /* grass blades */
  const ground=document.getElementById('ground');
  for(let i=0;i<46;i++){
    const b=document.createElement('div');
    b.className='blade';
    b.style.left=(Math.random()*100)+'%';
    b.style.bottom=(60+Math.random()*70)+'%';
    b.style.height=(16+Math.random()*26)+'px';
    b.style.opacity=.35+Math.random()*.45;
    b.style.animationDelay=(Math.random()*3)+'s';
    ground.appendChild(b);
  }

  /* title letters */
  const TITLE='HAPPY BIRTHDAY!';
  [...TITLE].forEach(ch=>{
    const s=document.createElement('span');
    if(ch===' '){s.className='sp';s.innerHTML='&nbsp;';}
    else s.textContent=ch;
    titleEl.appendChild(s);
  });
  const letters=[...titleEl.querySelectorAll('span')];

  /* confetti */
  const cv=document.getElementById('confetti'),ctx=cv.getContext('2d');
  let parts=[],raf=null;
  const COLORS=['#FFC13B','#FF7A2F','#FF5FA2','#2AC9C0','#4FB84B','#FFFDF6','#5BB6F0'];
  function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
    cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
  size();addEventListener('resize',size);

  function burst(n){
    const cx=innerWidth/2,cy=innerHeight*0.46;
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,sp=4+Math.random()*15;
      parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4,
        w:7+Math.random()*10,h:9+Math.random()*14,
        c:COLORS[(Math.random()*COLORS.length)|0],
        r:Math.random()*Math.PI,vr:(Math.random()-.5)*.34,life:150+Math.random()*130});
    }
    if(!raf)loop();
  }
  function rain(n){
    for(let i=0;i<n;i++){
      parts.push({x:Math.random()*innerWidth,y:-30-Math.random()*innerHeight*.6,
        vx:(Math.random()-.5)*2,vy:2+Math.random()*3,
        w:7+Math.random()*9,h:9+Math.random()*13,
        c:COLORS[(Math.random()*COLORS.length)|0],
        r:Math.random()*Math.PI,vr:(Math.random()-.5)*.28,life:340});
    }
    if(!raf)loop();
  }
  function loop(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(p=>p.life>0&&p.y<innerHeight+60);
    parts.forEach(p=>{
      p.vy+=0.19;p.vx*=0.995;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
      ctx.fillStyle=p.c;ctx.globalAlpha=Math.min(1,p.life/45);
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    });
    raf=parts.length?requestAnimationFrame(loop):(ctx.clearRect(0,0,innerWidth,innerHeight),null);
  }

  /* sound: a cheerful little fanfare, made on the fly */
  let actx=null;
  function note(f,t,dur,type,vol){
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'triangle';o.frequency.setValueAtTime(f,actx.currentTime+t);
    g.gain.setValueAtTime(0.0001,actx.currentTime+t);
    g.gain.exponentialRampToValueAtTime(vol||.22,actx.currentTime+t+.02);
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+t+dur);
    o.connect(g);g.connect(actx.destination);
    o.start(actx.currentTime+t);o.stop(actx.currentTime+t+dur+.05);
  }
  function fanfare(){
    try{
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended')actx.resume();
      // wobble ticks while the sphere shakes
      [0,.18,.36,.54,.72].forEach((t,i)=>note(320+i*40,t,.08,'square',.10));
      // pop + rising fanfare
      const seq=[[523.25,.95],[659.25,1.08],[783.99,1.21],[1046.5,1.36]];
      seq.forEach(([f,t])=>note(f,t,.34,'triangle',.25));
      note(1318.5,1.62,.7,'triangle',.22);
      note(659.25,1.62,.7,'sine',.14);
    }catch(e){}
  }

  function open(){
    if(opened)return;opened=true;
    fanfare();
    stage.classList.add('shaking');
    const T=(fn,ms)=>timers.push(setTimeout(fn,reduce?Math.min(ms,120):ms));
    T(()=>{
      stage.classList.remove('shaking');
      stage.classList.add('opened','day');
      burst(220);
    },950);
    T(()=>{
      letters.forEach((l,i)=>setTimeout(()=>l.classList.add('in'),i*55));
    },1180);
    T(()=>{sub.classList.add('in');burst(90);},2150);
    T(()=>{pc.classList.add('in');},2600);
    T(()=>{sig.classList.add('in');},3150);
    T(()=>rain(70),3000);
    T(()=>rain(60),5200);
  }

  function reset(){
    timers.forEach(clearTimeout);timers=[];opened=false;parts=[];
    if(raf){cancelAnimationFrame(raf);raf=null;}
    ctx.clearRect(0,0,innerWidth,innerHeight);
    stage.classList.remove('opened','day','shaking');
    letters.forEach(l=>l.classList.remove('in'));
    sub.classList.remove('in');pc.classList.remove('in');sig.classList.remove('in');
    capsule.style.animation='none';void capsule.offsetWidth;capsule.style.animation='';
  }

  document.addEventListener('click',e=>{
    if(e.target.closest('#again')){reset();setTimeout(open,1200);return;}
    open();
  });
  document.addEventListener('keydown',e=>{
    if(e.key===' '||e.key==='Enter'){
      if(document.activeElement===again){reset();setTimeout(open,1200);}
      else{e.preventDefault();open();}
    }
  });
})();
</script>
